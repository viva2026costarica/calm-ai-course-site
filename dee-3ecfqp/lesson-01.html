<style>
:root{--bg:#0a0c11;--ink:#ffffff;--ink2:#e9ecf3;--muted:#aab2c3;--gold:#f5c76e;--line:#252c3b;--line2:#323a4d;--panel:#12161f}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink2);font:17px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;display:grid;place-items:center;padding:20px}
body::before{content:"";position:fixed;inset:0;background:radial-gradient(800px 500px at 50% -10%,rgba(124,196,255,.12),transparent 60%)}
.wrap{position:relative;width:100%;max-width:420px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:34px 28px;text-align:center}
.ic{font-size:2.2rem;line-height:1;margin-bottom:10px}
h1{font-family:"Fraunces",Georgia,serif;font-weight:400;color:var(--ink);font-size:1.7rem;margin:0 0 8px}
p{color:var(--muted);margin:0 0 18px}
form{display:flex;gap:8px}
input{flex:1;font:inherit;color:var(--ink);background:#070a0f;border:1px solid var(--line2);border-radius:12px;padding:11px 14px;min-width:0}
input:focus{outline:2px solid var(--gold);outline-offset:1px;border-color:transparent}
button{background:var(--gold);color:#0a0c11;border:0;border-radius:12px;padding:11px 18px;font-weight:700;font-size:.95rem;cursor:pointer}
button:hover{filter:brightness(1.05)}
.msg{min-height:1.4em;color:#ff8f70;font-size:.9rem;margin-top:12px}
</style>
